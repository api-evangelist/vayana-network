openapi: 3.2.0
info:
  title: Vayana API Documentation Compliance Suite API
  version: 1.0.0
  description: To integrate these APIs please follow documentation
servers:
- url: https://s.api.one.vayana.com
  description: Sandbox Server
tags:
- name: Compliance Suite
paths:
  /atlas/v1/gstin/{gstin}/returns-track/fy/{fy}:
    get:
      tags:
      - Compliance Suite
      summary: Get View And Track Returns
      description: View and Track Return API fetches public information on return filing of a particular GSTIN. You need to provide the financial year (FY) along with the GSTIN to fetch the results (return filings) done during that FY.
      operationId: eas_basic_v1_gstn_view_returns
      _peer-api: /basic/gstn/v3.0/commonapi/v1.0/returns?gstin=29HJKPS9689A8Z5&fy=2020-21&action=RETTRACK&type=R1
      parameters:
      - $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/parameters/0'
      - $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/parameters/1'
      - $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/parameters/2'
      - $ref: '#/paths/~1atlas~1v1~1gstin~1%7Bgstin%7D/get/parameters/3'
      - name: gstin
        required: true
        schema:
          type: string
          maxLength: 15
          example: 29HJKPS9689A8Z5
        description: GSTIN to search
        in: path
      - name: fy
        required: true
        schema:
          type: string
          example: 2017-18
        description: 'format = YYYY-YY <br />  min-value = 2017-18 '
        in: path
      - name: action
        required: true
        schema:
          type: string
          example: RETTRACK
        in: query
      responses:
        '200':
          description: Successful Response
          headers:
            X-ATLAS-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-ATLAS-CALL-ID'
            X-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-CALL-ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/400/content/application~1json/schema/properties/status'
                    example: '1'
                  data:
                    type: object
                    properties:
                      EFiledlist:
                        description: List of Electronically filed returns
                        type: array
                        items:
                          type: object
                          properties:
                            valid:
                              type: boolean
                              examples: true
                            mof:
                              type: string
                              examples:
                              - ONLINE
                            dof:
                              type: string
                              examples:
                              - 16-01-2018
                            ret_prd:
                              type: string
                              examples:
                              - '062017'
                            rtntype:
                              type: string
                              examples:
                              - GSTR3B
                            arn:
                              type: string
                              examples:
                              - AA080617000247D
                            status:
                              type: string
                              examples:
                              - Filed
                  error:
                    $ref: '#/paths/~1atlas~1v1~1irp~1%7Birp%7D~1einvoice~1%7Birn%7D~1pdf/get/responses/400/content/application~1json/schema/properties/error'
                    example: null
                  info:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/info'
                    example: null
                  additionalInfo:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/additionalInfo'
                    example: null
                  alert:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/alert'
                    example: null
                required:
                - status
                - data
        '400':
          description: Failure Response
          headers:
            X-ATLAS-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-ATLAS-CALL-ID'
            X-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-CALL-ID'
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - error
                properties:
                  status:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/400/content/application~1json/schema/properties/status'
                  data:
                    type: 'null'
                  error:
                    $ref: '#/paths/~1atlas~1v1~1irp~1%7Birp%7D~1einvoice~1%7Birn%7D~1pdf/get/responses/400/content/application~1json/schema/properties/error'
                    type: object
                  info:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/info'
                    example: null
                  additionalInfo:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/additionalInfo'
                    example: null
                  alert:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/alert'
                    example: null
        '403':
          description: Authorization information is missing or invalid.
          headers:
            X-ATLAS-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-ATLAS-CALL-ID'
            X-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-CALL-ID'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/403/content/application~1json/schema'
      security:
      - BearerAuth: []
  /atlas/v1/irp/{irp}/einvoice/bulk:
    post:
      tags:
      - Compliance Suite
      summary: Create Bulk einvoice
      description: Generate IRN(s) API supports creation of bulk e-invoices, as opposed to its basic counterpart. Create e-invoice in bulk is an asynchronous API, hence will give a task ID in response. Given a task ID, you could fetch the task status using Status API. In order to download the result, you would need to use Download API.
      operationId: eas_enriched_v1_generate_invoices
      _peer-api: /enriched/einv/v3.0/ni1/invoices
      parameters:
      - $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/parameters/0'
      - $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/parameters/1'
      - $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/parameters/2'
      - $ref: '#/paths/~1atlas~1v1~1irp~1%7Birp%7D~1einvoice/post/parameters/3'
      - $ref: '#/paths/~1atlas~1v1~1irp~1%7Birp%7D~1einvoice/post/parameters/4'
      - $ref: '#/paths/~1atlas~1v1~1irp~1%7Birp%7D~1einvoice/post/parameters/5'
      - $ref: '#/paths/~1atlas~1v1~1irp~1%7Birp%7D~1einvoice/post/parameters/6'
      - $ref: '#/paths/~1atlas~1v1~1irp~1%7Birp%7D~1einvoice/post/parameters/7'
      - required: true
        schema:
          type: string
          enum:
          - ni1
          - ni2
        description: IRP Provider as per GST registration for e-invoicing
        name: irp
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: array
                  items:
                    $ref: '#/paths/~1atlas~1v1~1irp~1%7Birp%7D~1einvoice/post/requestBody/content/application~1json/schema'
                meta:
                  type:
                  - object
                  - 'null'
                  properties:
                    pdf:
                      type: string
                      enum:
                      - Y
                      - N
                      example: Y
                    emailRecipientList:
                      type: array
                      items:
                        type: string
                        example: abc@@gmail.com
              required:
              - payload
      responses:
        '200':
          description: Successful Response
          headers:
            X-ATLAS-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-ATLAS-CALL-ID'
            X-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-CALL-ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/400/content/application~1json/schema/properties/status'
                    example: '1'
                  data:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/data'
                  error:
                    $ref: '#/paths/~1atlas~1v1~1irp~1%7Birp%7D~1einvoice~1%7Birn%7D~1pdf/get/responses/400/content/application~1json/schema/properties/error'
                    example: null
                  info:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/info'
                    example: null
                  additionalInfo:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/additionalInfo'
                    example: null
                  alert:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/alert'
                    example: null
                required:
                - status
                - data
          links:
            CheckTaskStatus:
              operationId: eas_enriched_v1_task_status
              parameters:
                task-id: $response.body#/data/task-id
        '400':
          description: Failure Response
          headers:
            X-ATLAS-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-ATLAS-CALL-ID'
            X-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-CALL-ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/400/content/application~1json/schema/properties/status'
                  data:
                    type: 'null'
                  error:
                    $ref: '#/paths/~1atlas~1v1~1irp~1%7Birp%7D~1einvoice~1%7Birn%7D~1pdf/get/responses/400/content/application~1json/schema/properties/error'
                    type: object
                  info:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/info'
                    example: null
                  additionalInfo:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/additionalInfo'
                    example: null
                  alert:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/alert'
                    example: null
                required:
                - status
                - error
        '403':
          description: Authorization information is missing or invalid.
          headers:
            X-ATLAS-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-ATLAS-CALL-ID'
            X-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-CALL-ID'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/403/content/application~1json/schema'
      security:
      - BearerAuth: []
  /atlas/v1/irp/{irp}/einvoice:
    post:
      tags:
      - Compliance Suite
      summary: Generate E-Invoice
      description: Generate IRN offers single e-invoice generation
      operationId: eas_basic_v1_generate_invoice
      _peer-api: /basic/einv/v3.0/ni1/eicore/v1.03/Invoice
      parameters:
      - $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/parameters/0'
      - $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/parameters/1'
      - $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/parameters/2'
      - name: X-FLYNN-N-IRP-GSP-CODE
        in: header
        required: true
        description: GSP Identifier
        schema:
          type: string
          enum:
          - vay
      - name: X-FLYNN-N-IRP-GSTIN
        in: header
        required: true
        description: GSTIN of the taxpayer
        schema:
          maxLength: 15
          example: 29HJKPS9689A8Z5
      - name: X-FLYNN-N-IRP-USERNAME
        in: header
        required: true
        description: Portal username associated with taxpayer GSTIN for the GSP, Non-sensitive
        schema:
          type: string
          example: test_24_001
      - name: X-FLYNN-N-IRP-PWD
        in: header
        required: false
        description: Portal password associated with GSTIN and Username for the GSP, Non-Sensitive. <br /> Provide either `X-FLYNN-N-IRP-PWD` or `X-FLYNN-S-IRP-PWD`
        schema:
          type: string
          example: Trial63$value
      - name: X-FLYNN-S-IRP-PWD
        in: header
        required: false
        description: Portal password associated with GSTIN and Username for the GSP encrypted, Non-Sensitive. <br /> Provide either `X-FLYNN-N-IRP-PWD` or `X-FLYNN-S-IRP-PWD`<br /> for encryption details see <a href='#secureEncryptionInEas'>S-REK<a/>
        schema:
          type: string
          example: Trial63$value
      - name: irp
        in: path
        required: true
        schema:
          type: string
          enum:
          - ni1
          - ni2
          example: ni1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              Title: 'GST-India Invoice Document '
              Description: GST Invoice format for IRN Generation in INDIA
              properties:
                Version:
                  type: string
                  minLength: 1
                  maxLength: 6
                  example: '1.1'
                Irn:
                  type: string
                  minLength: 64
                  maxLength: 64
                  example: ''
                TranDtls:
                  type: object
                  properties:
                    TaxSch:
                      type: string
                      minLength: 3
                      maxLength: 10
                      enum:
                      - GST
                      pattern: ^(GST)$
                      example: GST
                    SupTyp:
                      type: string
                      minLength: 3
                      maxLength: 10
                      enum:
                      - B2B
                      - SEZWP
                      - SEZWOP
                      - EXPWP
                      - EXPWOP
                      - DEXP
                      pattern: (?i)^((B2B)|(SEZWP)|(SEZWOP)|(EXPWP)|(EXPWOP)|(DEXP))$
                      example: B2B
                    RegRev:
                      type: string
                      minLength: 1
                      maxLength: 1
                      enum:
                      - Y
                      - N
                      pattern: ^([Y|N]{1})$
                      example: N
                    EcmGstin:
                      type: string
                      minLength: 15
                      maxLength: 15
                      pattern: ^([0-9]{2}[0-9A-Z]{13})$
                      example: null
                    IgstOnIntra:
                      type: string
                      minLength: 1
                      maxLength: 1
                      enum:
                      - Y
                      - N
                      pattern: ^([Y|N]{1})$
                      example: N
                  required:
                  - TaxSch
                  - SupTyp
                DocDtls:
                  type: object
                  properties:
                    Typ:
                      type: string
                      minLength: 3
                      maxLength: 3
                      enum:
                      - INV
                      - CRN
                      - DBN
                      pattern: (?i)^((INV)|(CRN)|(DBN))$
                      example: INV
                    'No':
                      type: string
                      minLength: 1
                      maxLength: 16
                      pattern: ^([a-zA-Z1-9]{1}[a-zA-Z0-9/-]{0,15})$
                      example: DOC/INV-ATS/001
                    Dt:
                      type: string
                      minLength: 10
                      maxLength: 10
                      pattern: ^[0-3][0-9]/[0-1][0-9]/[2][0][1-2][0-9]$
                      example: 24/09/2023
                  required:
                  - Typ
                  - 'No'
                  - Dt
                SellerDtls:
                  type: object
                  properties:
                    Gstin:
                      type: string
                      minLength: 15
                      maxLength: 15
                      pattern: ([0-9]{2}[0-9A-Z]{13})
                      example: 27AAAPI3182M002
                    LglNm:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: NIC company pvt ltd
                    TrdNm:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: NIC Industries
                    Addr1:
                      type: string
                      minLength: 1
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: 5th block, kuvempu layout
                    Addr2:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: kuvempu layout
                    Loc:
                      type: string
                      minLength: 3
                      maxLength: 50
                      pattern: ^([^\"])*$
                      example: Maharastra
                    Pin:
                      type: number
                      minimum: 100000
                      maximum: 999999
                      example: 400049
                    Stcd:
                      type: string
                      minLength: 1
                      maxLength: 2
                      pattern: ^(?!0+$)([0-9]{1,2})$
                      example: '27'
                    Ph:
                      type: String
                      minLength: 6
                      maxLength: 12
                      pattern: ^([0-9]{6,12})$
                      example: '9000000000'
                    Em:
                      type: string
                      minLength: 6
                      maxLength: 100
                      pattern: ^[a-zA-Z0-9+_.-]+@[a-zA-Z0-9.-]+$
                      example: abc@gmail.com
                  required:
                  - Gstin
                  - LglNm
                  - Addr1
                  - Loc
                  - Pin
                  - Stcd
                BuyerDtls:
                  type: object
                  properties:
                    Gstin:
                      type: string
                      minLength: 3
                      maxLength: 15
                      pattern: ^(([0-9]{2}[0-9A-Z]{13})|URP)$
                      example: 19AAAPI3182M007
                    LglNm:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: XYZ company pvt ltd
                    TrdNm:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: XYZ Industries
                    Pos:
                      type: string
                      minLength: 1
                      maxLength: 2
                      pattern: ^(?!0+$)([0-9]{1,2})$
                      example: '19'
                    Addr1:
                      type: string
                      minLength: 1
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: 7th block, kuvempu layout
                    Addr2:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: kuvempu layout
                    Loc:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: Kolkata
                    Pin:
                      type: ' number'
                      minimum: 100000
                      maximum: 999999
                      example: 722144
                    Stcd:
                      type: string
                      minLength: 1
                      maxLength: 2
                      pattern: ^(?!0+$)([0-9]{1,2})$
                      example: 19
                    Ph:
                      type: String
                      minLength: 6
                      maxLength: 12
                      pattern: ^([0-9]{6,12})$
                      example: '91111111111'
                    Em:
                      type: string
                      minLength: 6
                      maxLength: 100
                      pattern: ^[a-zA-Z0-9+_.-]+@[a-zA-Z0-9.-]+$
                      example: xyz@yahoo.com
                  required:
                  - Gstin
                  - LglNm
                  - Pos
                  - Addr1
                  - Loc
                  - Stcd
                DispDtls:
                  type: object
                  properties:
                    Nm:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: ABC company pvt ltd
                    Addr1:
                      type: string
                      minLength: 1
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: 7th block, kuvempu layout
                    Addr2:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: kuvempu layout
                    Loc:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: Maharastra
                    Pin:
                      type: number
                      minimum: 100000
                      maximum: 999999
                      example: '400049'
                    Stcd:
                      type: string
                      minLength: 1
                      maxLength: 2
                      pattern: ^(?!0+$)([0-9]{1,2})$
                      example: '27'
                  required:
                  - Nm
                  - Addr1
                  - Loc
                  - Pin
                  - Stcd
                ShipDtls:
                  type: object
                  properties:
                    Gstin:
                      type: string
                      maxLength: 15
                      minLength: 3
                      pattern: ^(([0-9]{2}[0-9A-Z]{13})|URP)$
                      example: 27ACBPN2353E1ZX
                    LglNm:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: CBE company pvt ltd
                    TrdNm:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: kuvempu layout
                    Addr1:
                      type: string
                      minLength: 1
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: 7th block, kuvempu layout
                    Addr2:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: kuvempu layout
                    Loc:
                      type: string
                      minLength: 3
                      maxLength: 100
                      pattern: ^([^\"])*$
                      example: ABC
                    Pin:
                      type: number
                      minimum: 100000
                      maximum: 999999
                      example: '400049'
                    Stcd:
                      type: string
                      minLength: 1
                      maxLength: 2
                      pattern: ^(?!0+$)([0-9]{1,2})$
                      example: '27'
                  required:
                  - LglNm
                  - Addr1
                  - Loc
                  - Pin
                  - Stcd
                ItemList:
                  type: array
                  items:
                    type: object
                    properties:
                      SlNo:
                        type: string
                        minLength: 1
                        maxLength: 6
                        pattern: ^([0-9]{1,6})$
                        example: '1'
                      PrdDesc:
                        type: string
                        minLength: 3
                        maxLength: 300
                        pattern: ^([^\"])*$
                        example: Rice
                      IsServc:
                        type: string
                        minLength: 1
                        maxLength: 1
                        enum:
                        - Y
                        - N
                        pattern: ^([Y|N]{1})$
                        example: N
                      HsnCd:
                        type: string
                        minLength: 4
                        maxLength: 8
                        pattern: ^(?!0+$)([0-9]{4}|[0-9]{6}|[0-9]{8})$
                        example: '1001'
                      Barcde:
                        type: string
                        minLength: 3
                        maxLength: 30
                        pattern: ^([^\"])*$
                        example: '123456'
                      Qty:
                        type: number
                        minimum: 0
                        maximum: 9999999999.999
                        example: 100.345
                      FreeQty:
                        type: number
                        minimum: 0
                        maximum: 9999999999.999
                        example: 10
                      Unit:
                        type: string
                        minLength: 3
                        maxLength: 8
                        pattern: ^([A-Z|a-z]{3,8})$
                        example: BAG
                      UnitPrice:
                        type: number
                        minimum: 0
                        maximum: 999999999999.999
                        example: 99.545
                      TotAmt:
                        type: number
                        minimum: 0
                        maximum: 999999999999.99
                        example: 9988.84
                      Discount:
                        type: number
                        minimum: 0
                        maximum: 999999999999.99
                        example: 10
                      PreTaxVal:
                        type: number
                        minimum: 0
                        maximum: 999999999999.99
                        example: 1
                      AssAmt:
                        type: number
                        minimum: 0
                        maximum: 999999999999.99
                        example: 9978.84
                      GstRt:
                        type: number
                        minimum: 0
                        maximum: 999.999
                        example: 12
                      IgstAmt:
                        type: number
                        minimum: 0
