  /atlas/v1/eway/{ewb-provider}/eway-bill:
    post:
      tags:
      - Compliance Suite
      summary: Create E-Way Bill
      description: Generate E-way Bill API is used to generate an E-way Bill using the given request payload.
      operationId: eas_basic_v1_generate_ewaybill
      _peer-api: /basic/eway/v3.0/ew1/v1.03/ewayapi/gen-ewb
      parameters:
      - $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/parameters/0'
      - $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/parameters/1'
      - $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/parameters/2'
      - name: X-FLYNN-N-EWB-GSP-CODE
        in: header
        required: true
        description: GSP Identifier
        schema:
          type: string
          enum:
          - vay
      - name: X-FLYNN-N-EWB-GSTIN
        in: header
        required: true
        description: GSTIN of the taxpayer
        schema:
          maxLength: 15
          example: 29HJKPS9689A8Z5
      - name: X-FLYNN-N-EWB-USERNAME
        in: header
        required: true
        description: Portal username associated with taxpayer GSTIN for the GSP, Non-sensitive
        schema:
          type: string
          example: test_24_001
      - name: X-FLYNN-N-EWB-PWD
        in: header
        required: false
        description: Portal password associated with GSTIN and Username for the GSP, Non-Sensitive. <br /> Provide either `X-FLYNN-N-EWB-PWD` or `X-FLYNN-S-EWB-PWD`
        schema:
          type: string
          example: Trial63$value
      - name: X-FLYNN-S-EWB-PWD
        in: header
        required: false
        description: Encrypted Portal password associated with GSTIN and Username for the GSP, Non-Sensitive.  <br /> Provide either `X-FLYNN-N-EWB-PWD` or `X-FLYNN-S-EWB-PWD` <br /> for encryption details see <a href='#secureEncryptionInEas'>S-REK<a/>
        schema:
          type: string
          example: Trial63$value
      - required: true
        schema:
          type: string
          enum:
          - ew1
          - ew2
          example: ew1
        description: E-way bill provider
        name: ewb-provider
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                supplyType:
                  type: string
                  maxLength: 1
                  minLength: 1
                  enum:
                  - O
                  - I
                  description: Supply Type
                  example: O
                subSupplyType:
                  type: string
                  description: Sub Supply Type
                  example: '1'
                subSupplyDesc:
                  type: string
                  maxLength: 20
                  description: Other Sub Supply Description
                  example: ''
                docType:
                  type: string
                  enum:
                  - INV
                  - CHL
                  - BIL
                  - BOE
                  - OTH
                  description: Document Type
                  example: INV
                docNo:
                  type: string
                  maxLength: 16
                  description: Document Number (Alphanumeric with / and - are allowed)
                  example: 7001-8
                docDate:
                  type: string
                  pattern: '[0-3][0-9]/[0-1][0-9]/[2][0][1-2][0-9]'
                  description: Document Date
                  example: 15/12/2017
                fromGstin:
                  type: string
                  maxLength: 15
                  minLength: 15
                  pattern: '[0-9]{2}[0-9|A-Z]{13}'
                  description: From GSTIN (Supplier or Consigner)
                  example: 27AAAPI3182M002
                fromTrdName:
                  type: string
                  maxLength: 100
                  description: From Trade Name (Consigner Trade name)
                  example: welton
                fromAddr1:
                  type: string
                  maxLength: 120
                  description: 'From Address Line 1 (Valid Special Chars #,-,/)'
                  example: 2ND CROSS NO 59  19  A
                fromAddr2:
                  type: string
                  maxLength: 120
                  description: 'From Address Line 2(Valid Special Chars # , - ,/)'
                  example: GROUND FLOOR OSBORNE ROAD
                fromPlace:
                  type: string
                  maxLength: 50
                  description: From Place
                  example: FRAZER TOWN
                actFromStateCode:
                  type: integer
                  maximum: 99
                  description: Actual From State Code
                  example: 29
                fromPincode:
                  type: integer
                  maximum: 999999
                  minimum: 100000
                  description: From Pincode
                  example: 560090
                fromStateCode:
                  type: integer
                  maximum: 99
                  description: From State Code
                  example: 27
                toGstin:
                  type: string
                  maxLength: 15
                  minLength: 15
                  pattern: '[0-9]{2}[0-9|A-Z]{13}'
                  description: To GSTIN (Consignee or Recipient)
                  example: 19AAAPI3182M007
                toTrdName:
                  type: string
                  maxLength: 100
                  description: To Trade Name (Consignee Trade name or Recipient Trade name)
                  example: sthuthya
                toAddr1:
                  type: string
                  maxLength: 120
                  description: 'To Address Line 1 (Valid Special Chars #,-,/)'
                  example: Shree Nilaya
                toAddr2:
                  type: string
                  maxLength: 120
                  description: 'To Address Line 2 (Valid Special Chars #,-,/)'
                  example: Dasarahosahalli
                toPlace:
                  type: string
                  maxLength: 50
                  description: To Place
                  example: Beml Nagar
                toPincode:
                  type: integer
                  description: To Pincode
                  example: 560090
                actToStateCode:
                  type: integer
                  maximum: 99
                  description: Actual To State Code
                  example: 29
                toStateCode:
                  type: integer
                  maximum: 99
                  description: To State Code
                  example: 19
                transactionType:
                  type: integer
                  maximum: 4
                  description: Transaction type
                  example: 4
                totalValue:
                  type: number
                  format: float
                  multipleOf: 0.01
                  description: 'Sum of Taxable value '
                  example: 56099
                cgstValue:
                  type: number
                  format: float
                  multipleOf: 0.01
                  description: CGST value
                  example: 0
                sgstValue:
                  type: number
                  format: float
                  multipleOf: 0.01
                  description: SGST value
                  example: 0
                igstValue:
                  type: number
                  format: float
                  multipleOf: 0.01
                  description: IGST value
                  example: 300.67
                cessValue:
                  type: number
                  format: float
                  multipleOf: 0.01
                  description: Cess value
                  example: 400.67
                cessNonAdvolValue:
                  type: number
                  format: float
                  multipleOf: 0.01
                  description: Cess Non Advol value
                  example: 400
                otherValue:
                  type: number
                  format: float
                  multipleOf: 0.01
                  description: 'Other charges, if any '
                  example: 0
                totInvValue:
                  type: number
                  format: float
                  multipleOf: 0.01
                  description: Total Invoice Value (Including taxable value, tax value,and other charges if any)
                  example: 68358
                transMode:
                  type: string
                  enum:
                  - '1'
                  - '2'
                  - '3'
                  - '4'
                  description: 'Mode of transport (Road-1, Rail-2, Air-3, Ship-4) '
                  example: '1'
                transDistance:
                  type: string
                  description: 'Distance (<4000 km) '
                  example: '100'
                transporterName:
                  type: string
                  maxLength: 100
                  description: Name of the transporter
                  example: trans name
                transporterId:
                  type: string
                  pattern: '[0-9]{2}[0-9|A-Z]{13}'
                  description: 15 Digit Transporter GSTIN/TRANSIN
                  example: 03AAAPI3182M002
                transDocNo:
                  type: string
                  maxLength: 15
                  description: Transport Document Number (Alphanumeric with / and – are allowed)
                  example: TRAN/DOC/12
                transDocDate:
                  type: string
                  description: Transport Document Date
                  example: 08/09/2020
                vehicleNo:
                  type: string
                  minLength: 7
                  maxLength: 15
                  description: Vehicle Number
                  example: PVC1234
                vehicleType:
                  type: string
                  description: Vehicle Type
                  example: R
                itemList:
                  type: array
                  items:
                    type: object
                    properties:
                      productName:
                        type: string
                        maxLength: 100
                        description: Product / Item Name
                        example: Wheat
                      productDesc:
                        type: string
                        maxLength: 100
                        description: Product / Item description
                        example: Wheat
                      hsnCode:
                        type: number
                        description: HSN Code
                        example: 1001
                      quantity:
                        type: number
                        description: Quantity
                        example: 4
                      qtyUnit:
                        type: string
                        maxLength: 3
                        minLength: 3
                        description: Unit
                        example: BOX
                      taxableAmount:
                        type: number
                        format: float
                        multipleOf: 0.01
                        description: Taxable Amount
                        example: '5609889'
                      sgstRate:
                        type: number
                        multipleOf: 0.001
                        description: SGST Rate of Tax
                        example: 0
                      cgstRate:
                        type: number
                        multipleOf: 0.001
                        description: CGST Rate of Tax
                        example: 0
                      igstRate:
                        type: number
                        multipleOf: 0.001
                        description: IGST Rate of Tax
                        example: 3
                      cessRate:
                        type: number
                        multipleOf: 0.001
                        description: Cess Rate of Tax
                        example: 3
                      cessNonadvol:
                        type: number
                        description: Cess Non-Advolerum
                        example: 0
                    required:
                    - hsnCode
                    - taxableAmount
              required:
              - supplyType
              - subSupplyType
              - docType
              - docNo
              - docDate
              - fromGstin
              - fromPincode
              - fromStateCode
              - toGstin
              - toPincode
              - toStateCode
              - transDistance
              - itemList
              - actToStateCode
              - actFromStateCode
              - totInvValue
              - transactionType
      responses:
        '200':
          description: Successful Response
          headers:
            X-ATLAS-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-ATLAS-CALL-ID'
            X-CALL-ID:
              $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/headers/X-CALL-ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/400/content/application~1json/schema/properties/status'
                    example: '1'
                  data:
                    type: object
                    properties:
                      ewayBillNo:
                        description: E-way bill number
                        type: string
                        example: '131002251962'
                      ewayBillDate:
                        type: string
                        description: E-way bill date, when e-way bill was generated (DD/MM/YYYY HH:MM:SS AM/PM)
                        example: 13/07/2023 03:13:00 PM
                      validUpto:
                        type: string
                        description: Validity of the E-way bill (DD/MM/YYYY HH:MM:SS AM/PM)
                        example: 14/07/2023 11:59:00 PM
                      alert:
                        type: string
                        example: 'Total invoice value is more than the sum of total assessible value and tax values, '
                  error:
                    $ref: '#/paths/~1atlas~1v1~1irp~1%7Birp%7D~1einvoice~1%7Birn%7D~1pdf/get/responses/400/content/application~1json/schema/properties/error'
                    example: null
                  info:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/info'
                    example: null
                  additionalInfo:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/additionalInfo'
                    example: null
                  alert:
                    $ref: '#/paths/~1atlas~1v1~1gcs~1bulk/post/responses/200/content/application~1json/schema/properties/alert'
                    example: null
                required:
                - status
                - data
        '400':
          description: Failure Response
          headers:
            X-ATLAS-CALL-ID:
