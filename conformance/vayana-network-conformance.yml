note: >-
  Vayana is a GSTN-authorized GST Suvidha Provider. Its market has an unusually strong domain
  standard set, and Vayana's contract speaks it natively rather than through a bespoke shape:
  the Generate E-Invoice request body IS the Indian GST e-invoice schema, field for field.

domain_standards:
- id: gst-einvoice-inv-01
  name: Indian GST e-invoice schema (INV-01 / IRP e-invoicing standard)
  authority: Goods and Services Tax Network (GSTN) / National Informatics Centre (NIC) Invoice Registration Portal
  conforms: true
  confidence: high
  evidence:
    type: contract-schema-signature
    location: openapi/vayana-network-atlas-openapi.json -> paths./atlas/v1/irp/{irp}/einvoice.post.requestBody.content.application/json.schema
    detail: >-
      The request body is the GST e-invoice document verbatim, not a Vayana abstraction over it.
      Root properties are Version, Irn, TranDtls, DocDtls, SellerDtls, BuyerDtls, DispDtls,
      ShipDtls, ItemList, ValDtls, PayDtls, RefDtls, AddlDocDtls, ExpDtls, EwbDtls, with
      Version pinned to "1.1". TranDtls carries TaxSch, SupTyp, RegRev, EcmGstin and IgstOnIntra;
      SellerDtls and BuyerDtls carry Gstin, LglNm, TrdNm, Pos, Stcd. Response fields include
      AckNo, AckDt, Irn, SignedInvoice and SignedQRCode.
    consequence: >-
      An integrator who already produces the government INV-01 payload can post it to Vayana with
      no field mapping. That is the difference this check is meant to draw.
  url: https://s.docs.atlas.vayana.com/

- id: nic-eway-bill
  name: NIC E-Way Bill API standard
  authority: National Informatics Centre, Government of India
  conforms: true
  confidence: high
  evidence:
    type: contract-operation-and-error-vocabulary
    location: openapi/vayana-network-atlas-openapi.json (Compliance Suite) and errors/vayana-network-problem-types.yml
    detail: >-
      Vayana exposes the NIC E-Way Bill operation set under its own paths (generate, cancel,
      update Part B, update transporter, extend validity, reject, consolidate, regenerate
      consolidated, initiate and change multi-vehicle movement, transporter and HSN master
      lookups) and surfaces the NIC error dictionary itself through a callable Get Error List
      operation, whose documented response carries 287 NIC error codes reproduced in the
      error catalog artifact.
  url: https://docs.enriched-api.vayana.com/routes/basic/ewb/

- id: gstn-returns-api
  name: GSTN Returns / taxpayer API ecosystem
  authority: Goods and Services Tax Network (GSTN)
  conforms: true
  confidence: high
  evidence:
    type: documented-passthrough-and-shared-validation
    location: https://docs.enriched-api.vayana.com/components/schema/#patterns-and-formats
    detail: >-
      Vayana publishes the GSTIN regular expression it validates against and cites its source as
      developer.gst.gov.in/apiportal/taxpayer/returns. Its GSTN surface covers authentication,
      OTP request, refresh, logout, GSTR-1 / GSTR-2A / GSTR-2B / GSTR-3B / GSTR-6 / CMP return
      download, view-and-track returns, search taxpayer and the Invoice Management System (IMS)
      operations, mirroring the GSTN taxpayer API contract.
  url: https://docs.gsp.vayana.com/GSTN/_index/

- id: gstn-gsp-authorization
  name: GSTN GST Suvidha Provider (GSP) authorization
  authority: Goods and Services Tax Network (GSTN)
  conforms: true
  confidence: high
  evidence:
    type: assigned-identifier
    detail: >-
      Vayana holds the GSP code "vay", which is the only value its APIs accept for the
      X-FLYNN-N-IRP-GSP-CODE and X-FLYNN-N-EWB-GSP-CODE headers. A GSP code is issued by GSTN,
      not self-asserted; taxpayers register against it on the government portal.
    location: https://docs.enriched-api.vayana.com/components/headers/#x-flynn-n-gsp-code
  url: https://www.vayana.com/gsp/

