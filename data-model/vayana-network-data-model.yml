note: >-
  Derived from the Atlas OpenAPI path structure, path parameters and inline request/response
  schemas. A caveat that matters for anyone consuming this: the contract declares
  components.schemas as EMPTY — all 65 operations inline their schemas — so there are no $ref
  edges to walk. The relationships below were read from identifier-carrying path parameters and
  from the e-invoice document's own nested structure, not from reference links.
identifier_conventions:
  note: >-
    Vayana's entities are keyed almost entirely on Indian government identifiers rather than on
    vendor-issued surrogate ids. There are no prefixed object ids (no "inv_", no "cus_"); the
    primary key of a taxpayer IS its GSTIN. The practical consequence is that an agent needs no
    id-mapping table, but every key is externally assigned and externally validated.
  validated_formats:
  - id: GSTIN
    regex_published: true
    source: https://docs.enriched-api.vayana.com/components/schema/#patterns-and-formats
    upstream: https://developer.gst.gov.in/apiportal/taxpayer/returns
  - id: IRN
    format: 64-character hex hash returned by the IRP on e-invoice registration
  - id: PAN
    scope: Permanent Account Number, the tax identity behind a GSTIN
  - id: CIN
    scope: Corporate Identity Number, keys the MCA company record
