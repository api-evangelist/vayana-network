aid: vayana-network
name: Vayana Network
description: 'Vayana (legal entity Vay Network Services Pvt. Ltd., founded 2016, headquartered
  in Pune, India) operates India''s trade credit infrastructure network, connecting buyers,
  sellers, banks and NBFCs across supply chains, and is a GSTN-authorized GST Suvidha Provider
  (GSP). Its developer surface spans three published programs: Vayana Atlas, an API marketplace
  for trade and compliance covering identity/business verification (PAN, GSTIN, Aadhaar, MCA,
  Udyam, EPF, bank account, vehicle, voter ID) alongside GST e-invoicing and E-Way Bill
  operations; the Enriched API Service (EAS), a higher-level wrapper adding bulk processing,
  PDF generation and long-running task handling over the GSTN, NIC E-Way Bill and IRP
  e-invoicing peers; and Vayana GSP Pass-Through API Service (PAS), a thin encrypted gateway
  to the same government ecosystems. Authentication across all three runs through Vayana''s
  own SSO service (internally "theodore"), and sensitive values are RSA/AES encrypted in
  transit above TLS.'
