note: 'Every /.well-known/ path returned a miss on every Vayana host. The two miss modes differ and both
  are recorded: the documentation and marketing hosts answer a genuine 404, while every API host (s.api.one.vayana.com,
  api.gsp.vayana.com, live/solo.enriched-api.vayana.com and yoda.api.vayanagsp.in) answers 503 Service
  Temporarily Unavailable to ANY unauthenticated GET, including the host root. That 503 is a blanket edge
  policy on Vayana''s API tier, not an outage: the same hosts serve authenticated traffic and are the
  documented production and sandbox bases. It does mean anonymous discovery against the API hosts is impossible,
  so a 404 could not be distinguished from a served document there even if one existed. No WellKnown or
  SecurityTxt pointer is wired into apis.yml, because nothing was served.'
