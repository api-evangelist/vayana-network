rfc9457: false
note: Vayana does not use RFC 9457 application/problem+json. It publishes its own error envelope in two
  shapes and, uniquely, exposes the full downstream E-Way Bill error dictionary through a live API operation
  (Get Error List) whose documented sample response carries the complete code table reproduced below.
  Codes 100-999 in ewb_error_codes are the NIC E-Way Bill portal's own vocabulary, surfaced verbatim by
  Vayana; they are the codes a caller actually sees, which is why they are catalogued here rather than
  treated as someone else's problem.
envelopes:
- id: v1-v2
  applies_to: API versions v1.0 and v2.0
  shape:
    error:
      message: string, mandatory
      type: string, mandatory
      args: map(string, any), optional
  success_shape:
    data: any valid JSON node
  source: https://docs.enriched-api.vayana.com/components/schema/#payloads-for-version-1-and-version-2
- id: v3
  applies_to: API version v3.0 and later
  shape:
    status: '"0" on failure, "1" on success'
    data: null on failure
    error:
      message: string, mandatory
      type: string, mandatory
      args: map(string, any), optional
    info: 'null'
    additionalInfo: 'null'
    alert: 'null'
  success_shape:
    status: '"1"'
    data: any valid JSON node
    error: 'null'
  source: https://docs.enriched-api.vayana.com/components/schema/#payloads-for-version-3
error_types:
- Authorization
- Runtime
- ResourceNotFound
- ClientRequest
problem_types:
- id: err-invalid-org
  type: Authorization
  status: 403
  title: Invalid organisation
  detail: The header value of key X-FLYNN-N-ORG-ID is invalid.
  remediation: Re-read data.associatedOrgs[].organisation.id from the SSO login response and send that
    value.
  source: https://docs.enriched-api.vayana.com/components/error-payloads/#invalid-org-details
- id: err-expired-token
  type: Authorization
  status: 403
  title: Expired token
  detail: The header value of key X-FLYNN-N-USER-TOKEN is expired.
  remediation: Refresh the token with PUT /theodore/apis/v1/authtokens before data.expiry. After hard
    expiry (6x the token duration) refresh is refused and the user must re-authenticate.
  source: https://docs.enriched-api.vayana.com/components/error-payloads/#expired-token
- id: err-invalid-token
  type: Authorization
  status: 403
  title: Invalid token
  detail: The header value of key X-FLYNN-N-USER-TOKEN is invalid.
  remediation: Re-issue a token with POST /theodore/apis/v1/authtokens.
  source: https://docs.enriched-api.vayana.com/components/error-payloads/#invalid-token
- id: err-active-tokens-limit-exceeded
  type: Authorization
  status: 401
  title: Active token limit exceeded
  detail: A user may hold at most 10 active tokens at a time.
  remediation: Log out unused sessions with POST /theodore/apis/v1/logout, or reuse an existing token
    instead of minting one per call.
  source: https://docs.enriched-api.vayana.com/components/error-payloads/#token-limit-exceed
- id: err-unable-to-decrypt-message-with-key
  type: Runtime
  status: 500
  title: Invalid REK
  detail: The server could not RSA-decrypt the value of X-FLYNN-S-REK.
  remediation: Encrypt the REK with the current published server public key using PKCS1Padding, base64-encode
    it, and confirm you are using the public key for the right environment and service (Authentication
    Service and EAS publish separate keys).
  source: https://docs.enriched-api.vayana.com/components/error-payloads/#invalid-rek
- id: err-aes-decryption-failed
  type: Runtime
  status: 500
  title: Invalid sensitive data
  detail: The server could not AES-decrypt a value sent in an X-FLYNN-S-* header or in the request payload.
  remediation: Use AES/ECB/PKCS7PADDING with the same REK you sent, or set X-FLYNN-N-AES-ENCRYPTION-MODE=CBC
    and supply X-FLYNN-S-IV.
  source: https://docs.enriched-api.vayana.com/components/error-payloads/#invalid-sensitive-data
- id: err-resource-not-found
  type: ResourceNotFound
  status: 404
  title: Task not found
  detail: The task-id given to a long-running-task Status, Result, Download or Pages call is unknown,
    or the page-number is out of range.
  remediation: Use the task-id returned by the originating asynchronous call. Task data is retained for
    7 days from generation.
  source: https://docs.enriched-api.vayana.com/routes/enriched/long-running-tasks/#errors
