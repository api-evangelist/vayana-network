note: >-
  Vayana publishes no price list, no tiers and no rate card on any of its properties. Every
  commercial path is a contact form: the Atlas marketplace routes to
  https://atlas.vayana.com/contact-us/, and the GSP product page routes to an enquiry form.
  Two facts are published that bear on cost, and they are recorded because they are the only
  concrete billing signals in the developer surface: the sandbox environment
  (solo.enriched-api.vayana.com) is a test system against GSTN Sandbox / NIC pre-prod, while the
  production environment (live.enriched-api.vayana.com) "uses live GSTN infrastructure with all
  API calls being chargeable" — so billing is per API call, metered in production only; and
  Vayana ships a first-party metering endpoint, Get Api Usage, that returns a caller's own usage
  report for any 90-day span within the last 18 months, optionally emailed as CSV. A buyer can
  therefore measure consumption precisely but cannot price it without talking to sales.
billing_signals:
